name: Performance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/performance.yml
      - Benchmarks/**
      - Package.swift
      - Scripts/run-benchmarks.sh
      - Sources/**
  pull_request:
    paths:
      - .github/workflows/performance.yml
      - Benchmarks/**
      - Package.swift
      - Scripts/run-benchmarks.sh
      - Sources/**
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref to benchmark as the baseline
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-benchmarks:
    name: Runtime regression check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: baseline
          persist-credentials: false
          ref: >-
            ${{ github.event.pull_request.base.sha || github.event.before ||
            inputs.baseline_ref }}
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          persist-credentials: false
      - name: Check whether runtime sources changed
        id: relevance
        run: |
          should_benchmark=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            should_benchmark=true
          else
            for path in \
              .github/workflows/performance.yml \
              Sources \
              Package.swift \
              Benchmarks/Sources \
              Benchmarks/Package.swift \
              Scripts/run-benchmarks.sh
            do
              if ! git diff --no-index --quiet "baseline/$path" "candidate/$path"; then
                should_benchmark=true
                break
              fi
            done
          fi
          echo "should_benchmark=$should_benchmark" >> "$GITHUB_OUTPUT"
      - name: Skip irrelevant performance comparison
        if: steps.relevance.outputs.should_benchmark != 'true'
        run: echo 'No measured runtime sources changed; skipping performance comparison.'
      - name: Select Xcode 26.4.1
        if: steps.relevance.outputs.should_benchmark == 'true'
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
      - name: Show toolchain
        if: steps.relevance.outputs.should_benchmark == 'true'
        run: swift --version
      - name: Align benchmark dependencies
        if: steps.relevance.outputs.should_benchmark == 'true'
        run: |
          # Compile each revision's native driver so intentional public API
          # changes do not make the baseline source-incompatible. The report
          # harness version and workload names still guard comparability.
          # Both source revisions must resolve the candidate dependency graph.
          # Otherwise an Echo update is measured as a TestDoubles regression.
          cp candidate/Package.resolved baseline/Benchmarks/Package.resolved
          cp candidate/Package.resolved candidate/Benchmarks/Package.resolved
      - name: Build benchmark drivers
        if: steps.relevance.outputs.should_benchmark == 'true'
        run: |
          # Swift 6.3.1 can crash in LoadableByAddress while compiling an older
          # adapter baseline. Apply the same frontend workaround to both sides.
          swift build \
            --package-path baseline/Benchmarks \
            --scratch-path baseline/.build/benchmarks \
            --configuration release \
            --product TestDoublesBenchmarks \
            -Xswiftc -Xllvm \
            -Xswiftc -sil-disable-pass=LoadableByAddress
          swift build \
            --package-path candidate/Benchmarks \
            --scratch-path candidate/.build/benchmarks \
            --configuration release \
            --product TestDoublesBenchmarks \
            -Xswiftc -Xllvm \
            -Xswiftc -sil-disable-pass=LoadableByAddress
      - name: Run paired benchmark trials
        if: steps.relevance.outputs.should_benchmark == 'true'
        run: |
          benchmark_baseline() {
            baseline/Scripts/run-benchmarks.sh \
              --suite comparable \
              --samples 3 \
              --target-ms 1 \
              --output "$RUNNER_TEMP/baseline-$1.json" \
              --quiet
          }
          benchmark_candidate() {
            candidate/Scripts/run-benchmarks.sh \
              --suite comparable \
              --samples 3 \
              --target-ms 1 \
              --output "$RUNNER_TEMP/candidate-$1.json"
          }

          benchmark_baseline 1
          benchmark_candidate 1
          benchmark_candidate 2
          benchmark_baseline 2
          benchmark_baseline 3
          benchmark_candidate 3
          benchmark_candidate 4
          benchmark_baseline 4
          benchmark_baseline 5
          benchmark_candidate 5
          benchmark_candidate 6
          benchmark_baseline 6
          benchmark_baseline 7
          benchmark_candidate 7
      - name: Compare performance
        if: steps.relevance.outputs.should_benchmark == 'true'
        run: >-
          candidate/Scripts/run-benchmarks.sh compare
          "$RUNNER_TEMP/baseline-1.json"
          "$RUNNER_TEMP/candidate-1.json"
          "$RUNNER_TEMP/baseline-2.json"
          "$RUNNER_TEMP/candidate-2.json"
          "$RUNNER_TEMP/baseline-3.json"
          "$RUNNER_TEMP/candidate-3.json"
          "$RUNNER_TEMP/baseline-4.json"
          "$RUNNER_TEMP/candidate-4.json"
          "$RUNNER_TEMP/baseline-5.json"
          "$RUNNER_TEMP/candidate-5.json"
          "$RUNNER_TEMP/baseline-6.json"
          "$RUNNER_TEMP/candidate-6.json"
          "$RUNNER_TEMP/baseline-7.json"
          "$RUNNER_TEMP/candidate-7.json"
          --max-regression-percent 20
      - name: Upload benchmark results
        if: always() && steps.relevance.outputs.should_benchmark == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-benchmarks
          path: ${{ runner.temp }}/*.json
          if-no-files-found: error
